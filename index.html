<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const parameter = new URLSearchParams(window.location.search).get('clawpilotTheme')
        let saved
        try { saved = localStorage.getItem('portfolio-theme') } catch {}
        const preference = parameter || saved
        const theme = ['light', 'dark'].includes(preference)
          ? preference
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', theme)
        // The app restores scroll itself; the home page opens on the cover's viewfinder, so its black and the clear header
        // are painted before the app loads (the cover clears data-boot once it is up).
        history.scrollRestoration = 'manual'
        if (!/^#(?:work|about|resume|exhibition|my-story|my-approach|selected-work|experience|beyond-work|contact)(?:\/|$)/.test(location.hash)) {
          document.documentElement.dataset.boot = ''
          document.documentElement.dataset.headerTone = 'clear'
        }
      })()
    </script>
    <style>
      html[data-boot] { background: #030403; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore the portfolio of Asmit Biswas, a Computer Science student at the Academy of Technology interested in software development, hackathons, cloud technologies, and developer communities." />
    <meta property="og:title" content="Asmit Biswas | Developer & Community Builder" />
    <meta property="og:description" content="Building at the intersection of code, creativity, and community." />
    <meta name="theme-color" content="#eef0f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Asmit Biswas | Developer &amp; Community Builder</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p>Asmit Biswas, Computer Science and Engineering student at the Academy of Technology. JavaScript is required for this portfolio.</p></noscript>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
