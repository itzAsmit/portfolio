<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <!-- Discord AI Bot cover: mock Discord window serving a numbered roast from a personal database. -->
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1016"/>
      <stop offset="1" stop-color="#171a22"/>
    </linearGradient>
    <linearGradient id="botface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c78ff"/>
      <stop offset="1" stop-color="#4651c4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#canvas)"/>
  <circle cx="1400" cy="120" r="260" fill="#5865F2" fill-opacity="0.07"/>
  <circle cx="180" cy="900" r="220" fill="#d0e266" fill-opacity="0.05"/>

  <!-- app window -->
  <g filter="url(#soft)">
    <rect x="90" y="70" width="1420" height="860" rx="26" fill="#1e2129"/>
  </g>
  <path d="M90 96 a26 26 0 0 1 26 -26 h1368 a26 26 0 0 1 26 26 v34 H90 Z" fill="#17191f"/>
  <circle cx="130" cy="100" r="7" fill="#f25f5c"/>
  <circle cx="156" cy="100" r="7" fill="#fcbd4e"/>
  <circle cx="182" cy="100" r="7" fill="#54d186"/>

  <!-- server rail -->
  <rect x="90" y="130" width="84" height="800" fill="#14161c"/>
  <rect x="106" y="150" width="52" height="52" rx="18" fill="#5865F2"/>
  <text x="132" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="24" fill="#ffffff">ab</text>
  <circle cx="132" cy="246" r="24" fill="#262a35"/>
  <circle cx="132" cy="310" r="24" fill="#262a35"/>
  <circle cx="132" cy="374" r="24" fill="#262a35"/>

  <!-- channel sidebar -->
  <rect x="174" y="130" width="236" height="800" fill="#1a1d24"/>
  <text x="198" y="176" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="22" fill="#e8eaf2">the boys ✦</text>
  <line x1="174" y1="196" x2="410" y2="196" stroke="#262a35" stroke-width="1.5"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" fill="#8d95a8">
    <rect x="186" y="216" width="212" height="40" rx="9" fill="#2a2e3a"/>
    <text x="200" y="242" fill="#f2f4fa"># general</text>
    <text x="200" y="296" fill="#6f778c">▾ TEXT CHANNELS</text>
    <text x="200" y="332"># announcements</text>
    <text x="200" y="368"># gaming</text>
    <text x="200" y="404"># roast-requests</text>
    <text x="200" y="464" fill="#6f778c">▾ VOICE CHANNELS</text>
    <text x="200" y="500">🔊 lobby</text>
    <circle cx="212" cy="530" r="10" fill="#54d186"/>
    <circle cx="238" cy="530" r="10" fill="#fcbd4e"/>
    <circle cx="264" cy="530" r="10" fill="#f25f5c"/>
  </g>

  <!-- chat header -->
  <line x1="410" y1="130" x2="1510" y2="130" stroke="#262a35" stroke-width="1.5"/>
  <text x="436" y="172" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#e8eaf2"># general</text>
  <text x="560" y="172" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6f778c">where the roast sessions live</text>

  <!-- message: riya -->
  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="452" cy="238" r="21" fill="#54d186"/>
    <text x="452" y="245" text-anchor="middle" font-size="18" font-weight="700" fill="#0f2a1c">R</text>
    <text x="488" y="232" font-size="19" font-weight="700" fill="#9ae6b8">riya</text>
    <text x="534" y="232" font-size="16" fill="#6f778c">Today at 9:14 PM</text>
    <text x="488" y="262" font-size="21" fill="#c7ccd9">someone roast ankit, he's being smug again 😂</text>
  </g>

  <!-- message: arjun invokes the command -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <circle cx="452" cy="326" r="21" fill="#fcbd4e"/>
    <text x="452" y="333" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#4a3405">A</text>
    <text x="488" y="320" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#f7d38b">arjun</text>
    <text x="552" y="320" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6f778c">Today at 9:14 PM</text>
    <rect x="488" y="336" width="120" height="34" rx="8" fill="#2a2e3a"/>
    <text x="504" y="360" font-size="19" fill="#d0e266">!ankit</text>
  </g>

  <!-- message: the bot -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="426" y="410" width="52" height="52" rx="18" fill="url(#botface)"/>
    <circle cx="444" cy="429" r="5.5" fill="#10151f"/>
    <circle cx="462" cy="429" r="5.5" fill="#10151f"/>
    <path d="M441 446 q10 6 20 0" stroke="#10151f" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="472" cy="456" r="8" fill="#d0e266"/>
    <text x="496" y="426" font-size="19" font-weight="700" fill="#e8eaf2">Discord AI Bot</text>
    <rect x="632" y="410" width="44" height="20" rx="5" fill="#5865F2"/>
    <text x="654" y="425" text-anchor="middle" font-size="13" font-weight="700" fill="#eef0ff">BOT</text>
  </g>

  <!-- roast embed card -->
  <g>
    <rect x="492" y="478" width="720" height="166" rx="12" fill="#22252e"/>
    <rect x="492" y="478" width="7" height="166" rx="3.5" fill="#f25f5c"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="524" y="516" font-size="21" font-weight="700" fill="#e8eaf2">Ankit — roast #17 of 27 🔥</text>
      <text x="524" y="552" font-size="19" fill="#9aa3b5">"Carried the team exactly once in 2024</text>
      <text x="524" y="584" font-size="19" fill="#9aa3b5">and filed it as a personality trait."</text>
      <text x="524" y="620" font-size="17" fill="#6f778c">served from ankit_db · next: #18 · !roastlist for the scoreboard</text>
    </g>
  </g>

  <!-- command autocomplete popup -->
  <g>
    <rect x="440" y="676" width="470" height="150" rx="12" fill="#262a35" filter="url(#soft)"/>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="19">
      <rect x="452" y="688" width="446" height="40" rx="8" fill="#343948"/>
      <text x="470" y="714" fill="#d0e266">!ankit</text>
      <text x="544" y="714" fill="#8d95a8">serve the next roast</text>
      <text x="470" y="756" fill="#8d95a8">!roastlist</text>
      <text x="586" y="756" fill="#6f778c">database scoreboard</text>
      <text x="470" y="794" fill="#8d95a8">!helpme</text>
      <text x="566" y="794" fill="#6f778c">all commands</text>
    </g>
  </g>

  <!-- message input -->
  <g>
    <rect x="440" y="856" width="1040" height="60" rx="16" fill="#262a35"/>
    <circle cx="476" cy="886" r="14" fill="#3a3f4d"/>
    <text x="476" y="892" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#8d95a8">+</text>
    <text x="508" y="893" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#6f778c">Message #general — or tag the bot for an AI roast</text>
  </g>

  <!-- status footer outside the window -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24">
    <circle cx="120" cy="972" r="10" fill="#d0e266"/>
    <text x="146" y="980" fill="#8d95a8">discord-ai-bot — online since January 2026 — 44 commits of refining the craft</text>
  </g>
</svg>
